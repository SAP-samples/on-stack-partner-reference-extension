# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: loyaltyhub
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: <DESTINATION_NAME>
          url: <SYSTEM_URL>
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZLOYALTYHUB
          description: Manage Loyalty Hub
          package: ZPRA_LOYALTYHUB
          transport: <TRANSPORT_REQUEST>
        exclude:
          - /test/
